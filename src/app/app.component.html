<ion-app>
  <ion-content contentId="main-content">
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-content>
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      @for (p of appPages; track p; let i = $index) {
        <ion-tab-button
          tab="{{ p.url.substr(1) | lowercase}}"
          routerDirection="root"
          [routerLink]="[p.url]"
          >
          <ion-icon [name]="p.icon"></ion-icon>
          {{ p.title }}
        </ion-tab-button>
      }
    </ion-tab-bar>
  </ion-tabs>
</ion-app>
