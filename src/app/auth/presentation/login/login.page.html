<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>G-Museo</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      @if (error()) {
        <ion-text color="danger">
          <p>{{ error() }}</p>
        </ion-text>
      }

      <ion-item>
        <ion-input
          type="email"
          label="Email"
          labelPlacement="floating"
          [(ngModel)]="email"
          autocomplete="email">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="password"
          label="Contraseña"
          labelPlacement="floating"
          [(ngModel)]="password"
          autocomplete="current-password">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        class="ion-margin-top"
        [disabled]="loading()"
        (click)="login()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
