<div id="monthly-list">
  <div class="list-component">
    @for (graffiti of graffitiList; track graffiti) {
      <div
        class="item-container">
        <img class="monthly-list-img"
          [src]="graffiti.image"
          [alt]="graffiti.description">
        <div class="item-text">
          <h2>{{ graffiti.name }}</h2>
        </div>
      </div>
    }
  </div>
</div>
