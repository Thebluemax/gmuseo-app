# Lint and unit tests. The Node version comes from .nvmrc so the workflows, the
# Dockerfile and a local checkout never drift apart.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI Code Quality and Unit Test

on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Linter with ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use the Node.js version pinned in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run lint

  unit-test:
    name: Unit Test with Karma and Jasmine
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4
      - name: Use the Node.js version pinned in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - run: npm run test:prod
      - name: Update coverage badge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@main
