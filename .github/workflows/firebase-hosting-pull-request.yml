name: Deploy to Firebase Hosting on PR
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags for deploy'
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the Node.js version pinned in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GMUSEO_44A34 }}'
          projectId: gmuseo-44a34
